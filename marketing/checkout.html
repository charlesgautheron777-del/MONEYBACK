<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEYBACK — Lancer l'audit</title><style>body{font-family:system-ui;margin:0;background:#f7f8fa;color:#111827}main{max-width:760px;margin:auto;padding:60px 22px}.box{background:#fff;padding:30px;border-radius:22px;border:1px solid #e5e7eb}input{width:100%;box-sizing:border-box;padding:15px;margin:7px 0;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;padding:16px;margin-top:10px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.price{font-size:42px;font-weight:900}small{color:#667085}a{color:#111827}</style></head><body><main><a href="index.html">← MONEYBACK</a><div class="box"><h1>Lancer votre audit de dépenses</h1><p>Nous analysons vos données fournisseurs pour identifier les anomalies et opportunités de récupération.</p><div class="price">490 €</div><small>Audit pilote — paiement unique</small><form id="checkout"><input name="companyName" placeholder="Entreprise" required><input name="email" type="email" placeholder="Email professionnel" required><button>Continuer vers le paiement sécurisé</button></form><p id="msg"><small>Paiement traité par Stripe.</small></p></div></main><script>const f=document.querySelector('#checkout'),m=document.querySelector('#msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Création du paiement…';try{const r=await fetch('/functions/v1/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(!r.ok||!d.url)throw new Error(d.error||'Erreur');location.href=d.url}catch(x){m.textContent='Impossible de créer le paiement pour le moment.'}});</script></body></html>
