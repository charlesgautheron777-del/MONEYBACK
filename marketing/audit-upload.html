<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEYBACK — Déposer les données</title><style>body{font-family:system-ui;margin:0;background:#f7f8fa;color:#111827}main{max-width:760px;margin:auto;padding:60px 22px}.box{background:#fff;padding:30px;border-radius:22px;border:1px solid #e5e7eb}input,button{width:100%;box-sizing:border-box;padding:15px;margin-top:12px;border-radius:10px;font-size:16px}input{border:1px solid #d0d5dd}button{border:0;font-weight:800;cursor:pointer}small{color:#667085}</style></head><body><main><div class="box"><h1>Déposer vos données fournisseurs</h1><p>Importez votre export CSV pour lancer l'analyse automatique.</p><input id="file" type="file" accept=".csv,text/csv"><input id="job" placeholder="Identifiant d'audit"><input id="token" placeholder="Jeton d'accès" type="password"><button id="go">Lancer l'analyse</button><p id="msg"><small>Vos données restent traitées dans l'espace sécurisé MONEYBACK.</small></p></div></main><script>document.querySelector('#go').onclick=async()=>{const f=document.querySelector('#file').files[0],m=document.querySelector('#msg');if(!f){m.textContent='Sélectionnez un fichier CSV.';return}m.textContent='Envoi…';try{const fd=new FormData();fd.append('file',f);fd.append('auditJobId',document.querySelector('#job').value);fd.append('accessToken',document.querySelector('#token').value);const r=await fetch('/functions/v1/audit-submit',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');m.textContent='Données reçues. L’analyse va être lancée automatiquement.'}catch(e){m.textContent='Impossible de déposer les données pour le moment.'}};</script></body></html>
