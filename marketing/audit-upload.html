<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEYBACK — Dépôt des factures</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#101828;margin:0}main{max-width:720px;margin:auto;padding:55px 20px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:32px;box-shadow:0 10px 30px #1018280d}.drop{border:2px dashed #cfd4dc;border-radius:16px;padding:30px;text-align:center}.btn{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:11px;background:#111827;color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}.muted{color:#667085;line-height:1.6}input{margin-top:20px;width:100%}.note{font-size:13px}</style><main><div class="card"><h1>Déposez vos factures fournisseurs</h1><p class="muted">Importez votre export CSV jusqu’à 8 Mo. Le traitement démarre automatiquement après dépôt.</p><div class="drop"><input id="file" type="file" accept=".csv,text/csv"></div><button class="btn" id="go">Lancer l’audit</button><p id="msg" class="muted"></p><p class="muted note">Les identifiants d’accès ne sont jamais conservés dans l’historique du serveur via l’URL.</p></div></main><script>const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1)),job=q.get('auditJobId')||h.get('auditJobId')||'',token=h.get('accessToken')||q.get('accessToken')||'',dealId=q.get('dealId')||h.get('dealId')||'',file=document.querySelector('#file'),msg=document.querySelector('#msg'),button=document.querySelector('#go');if(h.has('accessToken'))history.replaceState(null,'',location.pathname+location.search);button.onclick=async()=>{if(!job||!token){msg.textContent='Lien d’audit incomplet. Revenez depuis l’email ou la page de confirmation de paiement.';return}if(!file.files[0]){msg.textContent='Sélectionnez un fichier CSV.';return}if(file.files[0].size>8*1024*1024){msg.textContent='Le fichier dépasse 8 Mo.';return}button.disabled=true;msg.textContent='Dépôt en cours…';const fd=new FormData();fd.set('dealId',dealId);fd.set('auditJobId',job);fd.set('accessToken',token);fd.set('file',file.files[0]);try{const r=await fetch(window.MONEYBACK_AUDIT_SUBMIT_ENDPOINT||'/functions/v1/audit-submit',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');location.href='audit-status.html?auditJobId='+encodeURIComponent(job)+'#accessToken='+encodeURIComponent(token)}catch(e){button.disabled=false;msg.textContent=e.message||'Échec du dépôt.'}}</script></html>
