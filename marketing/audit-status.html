<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEYBACK — Résultat de l'audit</title><style>body{font-family:system-ui;margin:0;background:#f7f8fa;color:#111827}main{max-width:800px;margin:auto;padding:60px 22px}.box{background:#fff;padding:30px;border-radius:22px;border:1px solid #e5e7eb}button{padding:14px 20px;border:0;border-radius:10px;font-weight:800;cursor:pointer}pre{white-space:pre-wrap}</style></head><body><main><div class="box"><h1>Résultat MONEYBACK</h1><p>Entrez votre identifiant et votre jeton d'accès pour consulter le rapport.</p><input id="job" placeholder="Identifiant" style="width:100%;box-sizing:border-box;padding:14px"><input id="token" placeholder="Jeton" type="password" style="width:100%;box-sizing:border-box;padding:14px;margin-top:10px"><button id="go">Consulter</button><pre id="out"></pre></div></main><script>document.querySelector('#go').onclick=async()=>{const out=document.querySelector('#out');out.textContent='Chargement…';try{const r=await fetch('/functions/v1/audit-status?auditJobId='+encodeURIComponent(document.querySelector('#job').value)+'&accessToken='+encodeURIComponent(document.querySelector('#token').value));const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent=e.message}};</script></body></html>
