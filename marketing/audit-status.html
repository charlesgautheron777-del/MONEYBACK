<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEYBACK — Suivi de l'audit</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#101828;margin:0}main{max-width:760px;margin:auto;padding:55px 20px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:32px;box-shadow:0 10px 30px #1018280d}.muted{color:#667085;line-height:1.6}.metric{font-size:28px;font-weight:900;margin:18px 0 6px}.btn{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:11px;background:#111827;color:#fff;text-decoration:none;font-weight:800}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef0f3;font-weight:800}.ok{color:#067647}.err{color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{padding:18px;border:1px solid #eaecf0;border-radius:14px;background:#fff}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><div class="card"><div class="pill" id="state">Chargement…</div><h1 id="title">Votre audit est en cours.</h1><p class="muted" id="desc">MONEYBACK traite votre dossier automatiquement. Cette page se met à jour sans action de votre part.</p><div id="result"></div><a class="btn" href="index.html">Retour à MONEYBACK</a></div></main><script>const q=new URLSearchParams(location.search),id=q.get('auditJobId'),token=q.get('accessToken');const endpoint=window.MONEYBACK_AUDIT_STATUS_ENDPOINT||'/functions/v1/audit-status';const $=s=>document.querySelector(s);function money(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0)}async function poll(){if(!id||!token){$('#state').textContent='Lien incomplet';$('#title').textContent='Impossible d’ouvrir le dossier.';return}try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auditJobId:id,accessToken:token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');const j=d.job;$('#state').textContent=(j.status||'pending').toUpperCase();if(j.status==='completed'&&d.report){$('#state').className='pill ok';$('#title').textContent='Audit terminé ✓';$('#desc').textContent='Votre rapport est prêt.';const x=d.report;$('#result').innerHTML=`<div class="grid"><div class="tile"><div class="muted">Lignes analysées</div><div class="metric">${Number(x.rows_analyzed)||0}</div></div><div class="tile"><div class="muted">Potentiel indicatif</div><div class="metric">${money(x.potential_savings_eur)}</div></div></div><a class="btn" target="_blank" rel="noopener" href="data:text/html;charset=utf-8,${encodeURIComponent(x.report_html||'<p>Rapport indisponible</p>')}">Ouvrir le rapport</a>`;return}if(j.status==='failed'){$('#state').className='pill err';$('#title').textContent='Une vérification est nécessaire';$('#desc').textContent=j.error_message||'Le traitement a rencontré un problème. Nous allons le reprendre.';return}setTimeout(poll,5000)}catch(e){$('#desc').textContent='Connexion temporairement indisponible. Nouvelle tentative…';setTimeout(poll,7000)}}poll();</script></html>
